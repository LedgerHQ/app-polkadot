name: Verify PRs to main

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

jobs:
  ledger-check-version:
    uses: Zondax/_workflows/.github/workflows/_ledger_check_version.yml@v3
    with:
      runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'zondax' && 'zondax-runners' || 'ubuntu-latest' }}
